<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园失物招领</title>
  <style>
    body { max-width: 850px; margin: 30px auto; padding: 0 15px; font: 16px Arial; background: #f5f7fb; }
    h1 { color: #3266df; }
    form, article { background: white; padding: 18px; margin: 15px 0; border-radius: 10px; }
    input, select, textarea { padding: 9px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; }
    form input, form textarea { display: block; width: 95%; }
    textarea { height: 65px; }
    button { padding: 9px 15px; border: 0; border-radius: 6px; background: #3266df; color: white; cursor: pointer; }
    small { color: #777; }
  </style>
</head>
<body>
  <h1>🔎 校园失物招领</h1>

  <form id="publish">
    <h2>发布信息</h2>
    <select name="type"><option>寻物</option><option>招领</option></select>
    <input name="title" placeholder="物品名称" required>
    <input name="place" placeholder="丢失或拾到地点" required>
    <textarea name="description" placeholder="物品描述" required></textarea>
    <button>发布</button>
  </form>

  <h2>最新信息</h2>
  <input id="search" placeholder="搜索物品或地点">
  <select id="filter">
    <option>全部</option><option>寻物</option><option>招领</option>
  </select>
  <div id="list"></div>

  <script>
    const key = "lost-found-posts";
    let posts = JSON.parse(localStorage.getItem(key) || "[]");

    function safe(text) {
      return String(text).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
      );
    }

    function render() {
      const word = search.value.trim().toLowerCase();
      const type = filter.value;
      const results = posts.filter(p =>
        (type === "全部" || p.type === type) &&
        (p.title + p.place).toLowerCase().includes(word)
      );

      list.innerHTML = results.length
        ? results.map(p => `
            <article>
              <small>${safe(p.type)} · ${safe(p.place)}</small>
              <h3>${safe(p.title)}</h3>
              <p>${safe(p.description)}</p>
              <button onclick="alert('认领功能需要接入后端')">
                ${p.type === "招领" ? "申请认领" : "提供线索"}
              </button>
            </article>
          `).join("")
        : "<p>暂无符合条件的信息</p>";
    }

    publish.onsubmit = e => {
      e.preventDefault();
      posts.unshift(Object.fromEntries(new FormData(publish)));
      localStorage.setItem(key, JSON.stringify(posts));
      publish.reset();
      render();
    };

    search.oninput = render;
    filter.onchange = render;
    render();
  </script>
</body>
</html>
